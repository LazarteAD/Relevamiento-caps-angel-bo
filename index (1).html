<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Registro ROU — CCSC · CAPS Ángel Bo</title>
<style>
  :root{
    --primary:#0B4C8C;      /* TODO: reemplazar por el azul institucional exacto */
    --primary-dark:#073A63; /* TODO: reemplazar por el acento del logo */
    --accent:#F2A900;       /* TODO: reemplazar por el color de acento del logo */
    --bg:#F5F7FA;
    --card:#FFFFFF;
    --text:#1B2430;
    --muted:#6B7686;
    --border:#DCE2EA;
    --danger:#B3261E;
    --ok:#1E7B34;
  }
  *{box-sizing:border-box}
  body{margin:0;font-family:-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif;background:var(--bg);color:var(--text)}
  header{background:var(--primary);color:#fff;padding:18px 20px;display:flex;align-items:center;gap:12px}
  header .logo{width:40px;height:40px;border-radius:8px;background:var(--accent);display:flex;align-items:center;justify-content:center;font-weight:700;color:var(--primary-dark)}
  header h1{font-size:16px;margin:0;font-weight:600}
  header p{margin:2px 0 0;font-size:12px;opacity:.85}
  main{max-width:640px;margin:0 auto;padding:16px}
  .card{background:var(--card);border:1px solid var(--border);border-radius:10px;padding:18px;margin-bottom:16px}
  .card h2{font-size:14px;margin:0 0 4px;color:var(--primary)}
  .card .hint{font-size:12px;color:var(--muted);margin:0 0 10px}
  label{display:block;font-size:13px;font-weight:600;margin:12px 0 5px}
  label small{display:block;font-weight:400;color:var(--muted);font-size:11px;margin-top:2px}
  input,select,textarea{width:100%;padding:10px;border:1px solid var(--border);border-radius:7px;font-size:14px;font-family:inherit}
  textarea{min-height:60px;resize:vertical}
  .row{display:flex;gap:10px}
  .row>div{flex:1}
  button{cursor:pointer;border:none;border-radius:7px;font-size:14px;font-weight:600;padding:11px 16px}
  .btn-primary{background:var(--primary);color:#fff;width:100%;margin-top:16px}
  .btn-primary:active{background:var(--primary-dark)}
  .btn-secondary{background:#fff;color:var(--primary);border:1px solid var(--primary)}
  .result{margin-top:10px;padding:10px;border-radius:7px;font-size:13px;font-weight:600;display:none}
  .result.normal{display:block;background:#E6F4EA;color:var(--ok)}
  .result.alterada{display:block;background:#FCEAEA;color:var(--danger)}
  table{width:100%;border-collapse:collapse;font-size:11px}
  th,td{text-align:left;padding:6px;border-bottom:1px solid var(--border)}
  th{color:var(--muted);font-weight:600}
  .status{font-size:12px;margin-top:8px;padding:8px;border-radius:6px;display:none}
  .status.ok{display:block;background:#E6F4EA;color:var(--ok)}
  .status.err{display:block;background:#FCEAEA;color:var(--danger)}
  .toolbar{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
  .toolbar h2{font-size:14px;margin:0}
  .empty{color:var(--muted);font-size:13px;text-align:center;padding:20px 0}
  .tablewrap{overflow-x:auto}
  .badge-alt{color:var(--danger);font-weight:700}
  .opt-btn{width:100%;background:#fff;color:var(--text);border:1px solid var(--border);font-weight:600;padding:10px}
  .opt-btn.active{background:var(--primary);color:#fff;border-color:var(--primary)}
</style>
</head>
<body>

<header>
  <div class="logo">MH</div>
  <div>
    <h1>Registro por persona — CCSC</h1>
    <p>Posta de Tamizaje Tensional · CAPS Ángel Bo</p>
  </div>
</header>

<main>
  <div class="card">
    <h2>Control de presión arterial</h2>
    <p class="hint">Un registro por cada persona controlada.</p>
    <form id="form">
      <div class="row">
        <div>
          <label for="fecha">Fecha</label>
          <input type="date" id="fecha" required>
        </div>
        <div>
          <label for="horario">Horario</label>
          <input type="time" id="horario" required>
        </div>
      </div>

      <label for="responsable">Responsable del control</label>
      <input type="text" id="responsable" required placeholder="Nombre y apellido">

      <label for="nombrePersona">Nombre y apellido del usuario
        <small>O iniciales / DNI si se prefiere preservar identidad</small>
      </label>
      <input type="text" id="nombrePersona" required>

      <div class="row">
        <div>
          <label for="edad">Edad</label>
          <input type="number" id="edad" min="0" max="120">
        </div>
        <div>
          <label for="sexo">Sexo</label>
          <select id="sexo">
            <option value="">Seleccionar...</option>
            <option>Femenino</option>
            <option>Masculino</option>
            <option>Otro</option>
            <option>Prefiere no decir</option>
          </select>
        </div>
      </div>

      <div class="row">
        <div>
          <label for="sistolica">TA sistólica (mmHg)</label>
          <input type="number" id="sistolica" min="0" required>
        </div>
        <div>
          <label for="diastolica">TA diastólica (mmHg)</label>
          <input type="number" id="diastolica" min="0" required>
        </div>
      </div>

      <div class="result" id="result"></div>

      <label>¿Se derivó a la persona a Medicina General?</label>
      <div class="row" id="derivacionGroup">
        <div><button type="button" class="opt-btn" data-field="derivacion" data-value="No">No</button></div>
        <div><button type="button" class="opt-btn" data-field="derivacion" data-value="Sí">Sí</button></div>
      </div>
      <input type="hidden" id="derivacion" value="No" required>

      <label for="asistioMov">Asistió a módulo de movimiento</label>
      <select id="asistioMov" required>
        <option value="No">No</option>
        <option value="Sí">Sí</option>
      </select>

      <label for="observaciones">Observaciones</label>
      <textarea id="observaciones" placeholder="Ej: primer control, en tratamiento, etc."></textarea>

      <button type="submit" class="btn-primary">Guardar registro</button>
      <div class="status" id="status"></div>
    </form>
  </div>

  <div class="card">
    <div class="toolbar">
      <h2>Registros en este dispositivo (<span id="count">0</span>)</h2>
      <button class="btn-secondary" id="exportBtn">Exportar CSV</button>
    </div>
    <div class="tablewrap" id="tableWrap"><div class="empty">Todavía no cargaste ningún registro.</div></div>
  </div>
</main>

<script>
// ⚠️ Pegá acá la URL del Google Apps Script Web App (ver README.md / apps-script.gs)
const SHEET_WEBHOOK_URL = "";

const KEY = "rou_ccsc_personas_hurlingham";
const load = () => JSON.parse(localStorage.getItem(KEY) || "[]");
const save = (arr) => localStorage.setItem(KEY, JSON.stringify(arr));

document.getElementById('fecha').value = new Date().toISOString().slice(0,10);

function resultadoTA(sist, diast){
  if (isNaN(sist) || isNaN(diast) || (sist===0 && diast===0)) return null;
  return (sist >= 140 || diast >= 90) ? 'Alterada' : 'Normal';
}

function updateResult(){
  const sist = parseInt(sistolica.value||0), diast = parseInt(diastolica.value||0);
  const r = resultadoTA(sist, diast);
  const el = document.getElementById('result');
  if(!r){ el.style.display='none'; return; }
  el.className = 'result ' + (r==='Alterada' ? 'alterada' : 'normal');
  el.textContent = r === 'Alterada'
    ? '⚠ TA alterada (≥ 140/90) — considerar derivación protegida'
    : '✔ TA dentro de rango normal';
  if(r === 'Alterada') setDerivacion('Sí');
}
sistolica.addEventListener('input', updateResult);
diastolica.addEventListener('input', updateResult);

// Botones Sí/No de derivación
function setDerivacion(valor){
  document.getElementById('derivacion').value = valor;
  document.querySelectorAll('.opt-btn[data-field="derivacion"]').forEach(b=>{
    b.classList.toggle('active', b.dataset.value === valor);
  });
}
document.querySelectorAll('.opt-btn[data-field="derivacion"]').forEach(b=>{
  b.addEventListener('click', () => setDerivacion(b.dataset.value));
});
setDerivacion('No');

function renderTable(){
  const data = load();
  document.getElementById('count').textContent = data.length;
  const wrap = document.getElementById('tableWrap');
  if(!data.length){ wrap.innerHTML = '<div class="empty">Todavía no cargaste ningún registro.</div>'; return; }
  let html = '<table><tr><th>Fecha</th><th>Nombre</th><th>TA</th><th>Resultado</th><th>Derivación</th></tr>';
  data.slice().reverse().slice(0,30).forEach(d=>{
    const cls = d.resultado === 'Alterada' ? 'badge-alt' : '';
    html += `<tr><td>${d.fecha}</td><td>${d.nombrePersona}</td><td>${d.sistolica}/${d.diastolica}</td><td class="${cls}">${d.resultado}</td><td>${d.derivacion}</td></tr>`;
  });
  html += '</table>';
  wrap.innerHTML = html;
}
renderTable();

document.getElementById('form').addEventListener('submit', async (e) => {
  e.preventDefault();
  const sist = parseInt(sistolica.value), diast = parseInt(diastolica.value);
  const entry = {
    fecha: fecha.value, horario: horario.value, responsable: responsable.value,
    nombrePersona: nombrePersona.value, edad: edad.value, sexo: sexo.value,
    sistolica: sist, diastolica: diast, resultado: resultadoTA(sist, diast),
    derivacion: derivacion.value, asistioMov: asistioMov.value,
    observaciones: observaciones.value, timestamp: new Date().toISOString()
  };
  const data = load(); data.push(entry); save(data);
  renderTable();

  const statusEl = document.getElementById('status');
  if (SHEET_WEBHOOK_URL) {
    try {
      await fetch(SHEET_WEBHOOK_URL, {
        method: 'POST', mode: 'no-cors',
        headers: {'Content-Type':'text/plain'}, body: JSON.stringify(entry)
      });
      statusEl.className = 'status ok'; statusEl.textContent = 'Guardado y enviado a la planilla ✔';
    } catch(err){
      statusEl.className = 'status err'; statusEl.textContent = 'Guardado local. No se pudo enviar a la planilla.';
    }
  } else {
    statusEl.className = 'status ok'; statusEl.textContent = 'Guardado en este dispositivo. Configurá SHEET_WEBHOOK_URL para sincronizar con Sheets.';
  }
  e.target.reset();
  document.getElementById('fecha').value = new Date().toISOString().slice(0,10);
  document.getElementById('result').style.display = 'none';
  setDerivacion('No');
  document.getElementById('asistioMov').value = 'No';
});

document.getElementById('exportBtn').addEventListener('click', () => {
  const data = load();
  if(!data.length) return;
  const headers = Object.keys(data[0]);
  const rows = [headers.join(',')].concat(
    data.map(d => headers.map(h => `"${String(d[h]??'').replace(/"/g,'""')}"`).join(','))
  );
  const blob = new Blob([rows.join('\n')], {type:'text/csv'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'rou_ccsc_personas.csv';
  a.click();
});
</script>
</body>
</html>
